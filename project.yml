name: J2MEEmu
options:
  bundleIdPrefix: com.j2me
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: ""
    GCC_C_LANGUAGE_STANDARD: gnu11
    GCC_OPTIMIZATION_LEVEL: "2"
    CLANG_ENABLE_MODULES: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
targets:
  J2MEEmu:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: VM
        excludes:
          - "miniz/*"
      - path: VM/miniz
      - path: Bridge
      - path: BuiltAssets
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j2me.emu
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        HEADER_SEARCH_PATHS: ["App", "VM", "Bridge"]
        OTHER_LDFLAGS: ["-ObjC"]
