name: e2e-sim
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode app icon
        run: |
          mkdir -p App/Resources/Assets.xcassets/AppIcon.appiconset
          cp tools/appicon/Contents.json App/Resources/Assets.xcassets/AppIcon.appiconset/
          cp tools/appicon/Assets.json App/Resources/Assets.xcassets/Contents.json
          base64 -D -i tools/appicon/icon1024.b64 -o App/Resources/Assets.xcassets/AppIcon.appiconset/icon1024.png

      - name: Build MIDP API jar
        run: |
          cd MIDP
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -d classes @sources.txt
          jar cf midp.jar -C classes .
          cd ..
          mkdir -p BuiltAssets
          cp MIDP/midp.jar BuiltAssets/

      - name: Build sample game jar
        run: |
          cd tools
          mkdir -p classes
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d classes test/SnakeGame.java
          jar cfm snake.jar manifest.mf -C classes .
          ls -la classes/
          cd ..
          cp tools/snake.jar BuiltAssets/

      - name: Build CJK/flicker test game jar
        run: |
          cd tools
          rm -rf cjkclasses && mkdir -p cjkclasses
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d cjkclasses test/CjkTest.java
          jar cfm cjk.jar cjk_manifest.mf -C cjkclasses .
          cd ..

      - name: Build RMS save/load test game jar
        run: |
          cd tools
          rm -rf rmsclasses && mkdir -p rmsclasses
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d rmsclasses test/RmsTest.java
          jar cfm rmstest.jar rms_manifest.mf -C rmsclasses .
          cd ..

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          set -e -o pipefail
          xcodebuild -project J2MEEmu.xcodeproj -scheme J2MEEmu -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build build 2>&1 \
            | grep -E 'error|warning:|BUILD|FAILED|CompileC' | tail -120

      - name: Boot simulator & install app
        run: |
          set -e
          DEV=""
          for attempt in 1 2 3; do
            DEV=$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[A-F0-9-]{36}' || true)
            [ -n "$DEV" ] && break
            echo "attempt $attempt: no device listed, waiting..."
            sleep 15
          done
          if [ -z "$DEV" ]; then
            echo "=== available devices ==="
            xcrun simctl list devices available
            exit 1
          fi
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          sleep 10
          for attempt in 1 2 3; do
            if xcrun simctl install booted build/Build/Products/Release-iphonesimulator/J2MEEmu.app; then
              echo "INSTALLED (attempt $attempt)"
              break
            fi
            echo "install attempt $attempt failed, retrying after 20s..."
            sleep 20
            [ "$attempt" = "3" ] && exit 1
          done
          xcrun simctl listapps booted | grep -A2 j2me || true

      - name: Simulate user importing jars (before launch, for autostart)
        run: |
          set -e
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          echo "container=$DATA"
          mkdir -p "$DATA/Documents/games"
          cp tools/snake.jar "$DATA/Documents/games/MyImport.jar"
          cp tools/cjk.jar "$DATA/Documents/games/CjkTest.jar"
          cp tools/rmstest.jar "$DATA/Documents/games/RmsTest.jar"
          ls -la "$DATA/Documents/games/"

      - name: Launch app (library) & verify alive
        run: |
          set -e
          echo "launching..."
          xcrun simctl launch booted com.j2me.emu
          sleep 4
          echo "--- process check 1 ---"
          ps aux | grep "J2MEEmu.app" | grep -v grep || echo "APP DEAD at t=4s"
          xcrun simctl io booted screenshot shot_lib.png
          sleep 4
          echo "--- process check 2 ---"
          ps aux | grep "J2MEEmu.app" | grep -v grep || echo "APP DEAD at t=8s"

      - name: Autostart CJK game & burst screenshots
        run: |
          set -e
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart CjkTest.jar
          sleep 6
          for i in 1 2 3 4 5 6; do
            xcrun simctl io booted screenshot "game_$i.png"
            sleep 1
          done
          ps aux | grep "J2MEEmu.app" | grep -v grep || { echo "APP DEAD in game"; exit 1; }

      - name: Pixel check (blue checker + yellow CJK + frame stability)
        run: |
          pip3 install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import sys, glob

          shots = sorted(glob.glob("game_*.png"))
          assert len(shots) >= 4, f"need >=4 game shots, got {shots}"
          stats = []
          for p in shots:
              im = Image.open(p).convert("RGB")
              w, h = im.size
              px = im.load()
              blue = yellow = 0
              for y in range(0, h, 4):          # stride sampling
                  for x in range(0, w, 4):
                      r, g, b = px[x, y]
                      if b > 120 and b > r + 40 and b > g + 40:
                          blue += 1
                      elif r > 180 and g > 180 and b < 110:
                          yellow += 1
              stats.append((blue, yellow))
              print(f"{p}: blue={blue} yellow={yellow}")
          # 每帧棋盘格蓝格与黄色文字必须同时在场（黑帧/半帧则其一骤减）
          for i, (blue, yellow) in enumerate(stats):
              assert blue > 800, f"{shots[i]}: blue too low ({blue}) - flicker/black frame?"
              assert yellow > 30, f"{shots[i]}: yellow text missing ({yellow}) - CJK render broken?"
          # 相邻帧差异：画面应稳定（仅游戏区上 60px 与键盘区可能有小差）
          prev = None
          for p in shots:
              im = Image.open(p).convert("L").resize((120, 80))
              if prev is not None:
                  diff = sum(abs(a - b) for a, b in zip(prev.getdata(), im.getdata())) / (120 * 80)
                  print(f"diff {p}: {diff:.2f}")
                  assert diff < 40, f"frame-to-frame jump too large ({diff:.2f}) - flicker?"
              prev = im
          print("PIXEL CHECK PASS")
          PY

      - name: RMS save/load e2e (two launches)
        run: |
          set -e
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart RmsTest.jar
          sleep 6
          xcrun simctl io booted screenshot rms_save.png
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart RmsTest.jar
          sleep 6
          xcrun simctl io booted screenshot rms_load.png
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          ls -la "$DATA/Documents/rms/" || true

      - name: RMS pixel check (save=blue, load=green)
        run: |
          python3 - <<'PY'
          from PIL import Image

          def counts(path):
              im = Image.open(path).convert("RGB")
              w, h = im.size
              px = im.load()
              blue = green = red = 0
              for y in range(0, h, 4):
                  for x in range(0, w, 4):
                      r, g, b = px[x, y]
                      if b > 150 and r < 80 and g < 80:
                          blue += 1
                      elif g > 150 and r < 80 and b < 80:
                          green += 1
                      elif r > 150 and g < 80 and b < 80:
                          red += 1
              return blue, green, red

          b1, g1, r1 = counts("rms_save.png")
          print(f"rms_save: blue={b1} green={g1} red={r1}")
          assert b1 > 500, f"save run: blue blocks missing ({b1}) - RMS save broken?"
          b2, g2, r2 = counts("rms_load.png")
          print(f"rms_load: blue={b2} green={g2} red={r2}")
          assert g2 > 500, f"load run: green blocks missing ({g2}) - RMS load broken?"
          assert r1 < 20 and r2 < 20, f"red (FAIL) blocks present: {r1}/{r2}"
          print("RMS E2E PASS")
          PY

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            shot_lib.png
            game_*.png
            rms_save.png
            rms_load.png
