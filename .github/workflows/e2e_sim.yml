name: e2e-sim
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode app icon
        run: |
          mkdir -p App/Resources/Assets.xcassets/AppIcon.appiconset
          cp tools/appicon/Contents.json App/Resources/Assets.xcassets/AppIcon.appiconset/
          cp tools/appicon/Assets.json App/Resources/Assets.xcassets/Contents.json
          base64 -D -i tools/appicon/icon1024.b64 -o App/Resources/Assets.xcassets/AppIcon.appiconset/icon1024.png

      - name: Build MIDP API jar
        run: |
          cd MIDP
          mkdir -p classes
          find src -name "*.java" > sources.txt
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -d classes @sources.txt
          jar cf midp.jar -C classes .
          cd ..
          mkdir -p BuiltAssets
          cp MIDP/midp.jar BuiltAssets/

      - name: Build sample game jar
        run: |
          cd tools
          mkdir -p classes
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d classes test/SnakeGame.java
          jar cfm snake.jar manifest.mf -C classes .
          ls -la classes/
          cd ..
          cp tools/snake.jar BuiltAssets/

      - name: Build CJK/flicker test game jar
        run: |
          cd tools
          rm -rf cjkclasses && mkdir -p cjkclasses
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d cjkclasses test/CjkTest.java
          jar cfm cjk.jar cjk_manifest.mf -C cjkclasses .
          cd ..

      - name: OTA tone synth unit test (clang compat)
        run: |
          set -e
          cc -O2 -I Bridge -o ota_test tools/ota_test.c Bridge/midi_synth.c -lm
          ./ota_test

      - name: Build RMS save/load test game jar
        run: |
          cd tools
          rm -rf rmsclasses && mkdir -p rmsclasses
          javac -source 8 -target 8 -encoding UTF-8 -nowarn -cp ../MIDP/midp.jar -d rmsclasses test/RmsTest.java
          jar cfm rmstest.jar rms_manifest.mf -C rmsclasses .
          cd ..

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build simulator app
        run: |
          set -e -o pipefail
          xcodebuild -project J2MEEmu.xcodeproj -scheme J2MEEmu -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build build 2>&1 \
            | grep -E 'error|warning:|BUILD|FAILED|CompileC' | tail -120

      - name: Boot simulator & install app
        run: |
          set -e
          DEV=""
          for attempt in 1 2 3; do
            DEV=$(xcrun simctl list devices available | grep -m1 iPhone | grep -oE '[A-F0-9-]{36}' || true)
            [ -n "$DEV" ] && break
            echo "attempt $attempt: no device listed, waiting..."
            sleep 15
          done
          if [ -z "$DEV" ]; then
            echo "=== available devices ==="
            xcrun simctl list devices available
            exit 1
          fi
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          sleep 10
          for attempt in 1 2 3; do
            if xcrun simctl install booted build/Build/Products/Release-iphonesimulator/J2MEEmu.app; then
              echo "INSTALLED (attempt $attempt)"
              break
            fi
            echo "install attempt $attempt failed, retrying after 20s..."
            sleep 20
            [ "$attempt" = "3" ] && exit 1
          done
          xcrun simctl listapps booted | grep -A2 j2me || true

      - name: Simulate user importing jars (before launch, for autostart)
        run: |
          set -e
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          echo "container=$DATA"
          mkdir -p "$DATA/Documents/games"
          cp tools/snake.jar "$DATA/Documents/games/MyImport.jar"
          cp tools/cjk.jar "$DATA/Documents/games/CjkTest.jar"
          cp tools/rmstest.jar "$DATA/Documents/games/RmsTest.jar"
          ls -la "$DATA/Documents/games/"

      - name: Launch app (library) & verify alive
        run: |
          set -e
          echo "launching..."
          xcrun simctl launch booted com.j2me.emu
          sleep 4
          echo "--- process check 1 ---"
          ps aux | grep "J2MEEmu.app" | grep -v grep || echo "APP DEAD at t=4s"
          xcrun simctl io booted screenshot shot_lib.png
          sleep 4
          echo "--- process check 2 ---"
          ps aux | grep "J2MEEmu.app" | grep -v grep || echo "APP DEAD at t=8s"

      - name: Autostart CJK game & burst screenshots
        run: |
          set -e
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          # 基线：同一游戏、不注入按键（判定「回显行是否真的出现」，避免只看帧间差异）
          xcrun simctl launch booted com.j2me.emu --e2e-autostart CjkTest.jar
          sleep 6
          xcrun simctl io booted screenshot game_0_nokey.png
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          # 注入按键序列（游戏启动后 4.0-6.0s）：走 j2meKey 队列链路，画布底部回显按键记录
          xcrun simctl launch booted com.j2me.emu --e2e-autostart CjkTest.jar \
            --e2e-keys "4d@4.0,4u@4.4,6d@4.8,6u@5.2,53d@5.6,53u@6.0"
          sleep 8
          for i in 1 2 3 4 5 6; do
            xcrun simctl io booted screenshot "game_$i.png"
            sleep 1
          done
          ps aux | grep "J2MEEmu.app" | grep -v grep || { echo "APP DEAD in game"; exit 1; }

      - name: Pixel check (blue checker + yellow CJK + frame stability + key echo)
        run: |
          pip3 install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image
          import glob

          def counts(path):
              im = Image.open(path).convert("RGB")
              w, h = im.size
              px = im.load()
              blue = yellow = 0
              ystrict = yloose = 0
              for y in range(0, h, 4):          # stride sampling
                  for x in range(0, w, 4):
                      r, g, b = px[x, y]
                      if b > 120 and b > r + 40 and b > g + 40:
                          blue += 1
                      elif r > 180 and g > 180 and b < 110:
                          yellow += 1
                      # 黄字纯度：loose 含中间色，strict 仅锐利纯黄
                      if r > 140 and g > 140 and b < 110:
                          yloose += 1
                          if r > 220 and g > 220:
                              ystrict += 1
              return blue, yellow, ystrict, yloose

          base = counts("game_0_nokey.png")
          print(f"game_0_nokey.png: blue={base[0]} yellow={base[1]}")
          shots = sorted(glob.glob("game_?.png"))
          assert len(shots) >= 4, f"need >=4 game shots, got {shots}"
          stats = []
          for p in shots:
              s = counts(p)
              stats.append(s)
              print(f"{p}: blue={s[0]} yellow={s[1]} ystrict={s[2]} yloose={s[3]}")
          # 每帧棋盘格蓝格与黄色文字必须同时在场（黑帧/半帧则其一骤减）
          for i, (blue, yellow, ys, yl) in enumerate(stats):
              assert blue > 800, f"{shots[i]}: blue too low ({blue}) - flicker/black frame?"
              assert yellow > 30, f"{shots[i]}: yellow text missing ({yellow}) - CJK render broken?"
          # 文字锐利度：垫黑背景上的黄字若被亚像素混合污染，strict 占比骤降
          for i, (blue, yellow, ys, yl) in enumerate(stats):
              assert yl == 0 or ys * 100 >= yl * 55, \
                  f"{shots[i]}: yellow text blurry (strict {ys}/{yl}) - subpixel blending?"
          # 按键回显：与「同游戏无按键」基线对比，后段帧必须多出回显行黄像素
          assert stats[-1][1] > base[1] + 15, \
              f"key events not rendered: nokey={base[1]} last={stats[-1][1]} - key queue broken?"
          # 相邻帧差异：画面应稳定（仅游戏区上 60px 与键盘区可能有小差）
          prev = None
          for p in shots:
              im = Image.open(p).convert("L").resize((120, 80))
              if prev is not None:
                  diff = sum(abs(a - b) for a, b in zip(prev.getdata(), im.getdata())) / (120 * 80)
                  print(f"diff {p}: {diff:.2f}")
                  assert diff < 40, f"frame-to-frame jump too large ({diff:.2f}) - flicker?"
              prev = im
          print("PIXEL CHECK PASS")
          PY

      - name: RMS save/load e2e (two launches)
        if: always()
        run: |
          set -e
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart RmsTest.jar
          sleep 6
          xcrun simctl io booted screenshot rms_save.png
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart RmsTest.jar
          sleep 6
          xcrun simctl io booted screenshot rms_load.png
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          ls -la "$DATA/Documents/rms/" || true

      - name: RMS pixel check (save=blue, load=green)
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image

          def counts(path):
              im = Image.open(path).convert("RGB")
              w, h = im.size
              px = im.load()
              blue = green = red = 0
              for y in range(0, h, 4):
                  for x in range(0, w, 4):
                      r, g, b = px[x, y]
                      if b > 150 and r < 80 and g < 80:
                          blue += 1
                      elif g > 150 and r < 80 and b < 80:
                          green += 1
                      elif r > 150 and g < 80 and b < 80:
                          red += 1
              return blue, green, red

          b1, g1, r1 = counts("rms_save.png")
          print(f"rms_save: blue={b1} green={g1} red={r1}")
          assert b1 > 500, f"save run: blue blocks missing ({b1}) - RMS save broken?"
          b2, g2, r2 = counts("rms_load.png")
          print(f"rms_load: blue={b2} green={g2} red={r2}")
          assert g2 > 500, f"load run: green blocks missing ({g2}) - RMS load broken?"
          assert r1 < 20 and r2 < 20, f"red (FAIL) blocks present: {r1}/{r2}"
          print("RMS E2E PASS")
          PY

      - name: Virtual keypad hit-test & event chain (--e2e-uicheck)
        if: always()
        run: |
          set -e
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          xcrun simctl launch booted com.j2me.emu --e2e-autostart CjkTest.jar --e2e-uicheck
          sleep 8
          xcrun simctl io booted screenshot uicheck.png
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          echo "--- uicheck.txt ---"
          cat "$DATA/Documents/uicheck.txt"
          UICHECK="$DATA/Documents/uicheck.txt" python3 - <<'PY'
          import os, re
          path = os.environ["UICHECK"]
          txt = open(path, encoding="utf-8").read()
          print(txt)
          btn = int(re.search(r"buttons=(\d+)", txt).group(1))
          hitbad = int(re.search(r"hitBad=(\d+)", txt).group(1))
          before = int(re.search(r"dispatch_before=(\d+)", txt).group(1))
          after = int(re.search(r"dispatch_after=(\d+)", txt).group(1))
          asserts = (
              (btn >= 13, f"keypad buttons missing ({btn} < 13)"),
              (hitbad == 0, f"{hitbad} button(s) not hit-testable (covered/disabled)"),
              (after - before == 6, f"button events not dispatched: {before}->{after} (expect +6)"),
          )
          for ok, msg in asserts:
              if not ok:
                  raise SystemExit("UICHECK FAIL: " + msg)
          print("UICHECK PASS: buttons=%d hitBad=%d dispatched +%d" % (btn, hitbad, after - before))
          PY

      - name: Real game key smoke (War.jar)
        if: always()
        run: |
          set -e
          DATA=$(xcrun simctl get_app_container booted com.j2me.emu data)
          mkdir -p "$DATA/Documents/games"
          JARURL="https://java.iwkk.cn/jar/%E2%99%A8%EF%B8%8F7723%E5%88%86%E7%B1%BB%E5%AE%8C%E6%95%B4%E7%89%88%2F%E7%AD%96%E7%95%A5%2F%E6%AD%AA%E6%AD%AA%E6%AD%AA%E4%BC%A0%E6%88%98%E5%9B%BD%E9%A3%8E%E4%BA%91%2F%E8%AF%BA%E5%9F%BA%E4%BA%9A%20N70%E7%B3%BB%E5%88%97(176%C3%97208).jar"
          if ! curl -fsSL --max-time 180 -o "$DATA/Documents/games/War.jar" "$JARURL"; then
            echo "SKIP: war.jar download failed"; exit 0
          fi
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          # 基线：停在标题菜单（War 标题页自动弹出菜单），不注入按键
          xcrun simctl launch booted com.j2me.emu --e2e-autostart War.jar
          sleep 18
          xcrun simctl io booted screenshot war_before.png
          xcrun simctl terminate booted com.j2me.emu || true
          sleep 2
          # 注入 3 次「下」（游戏启动后 20.0-23.6s，标题菜单已就绪）：
          # 菜单高亮条应下移，前后画面差异即「真实游戏收到按键」的证据
          xcrun simctl launch booted com.j2me.emu --e2e-autostart War.jar \
            --e2e-keys "8d@20.0,8u@20.4,8d@21.6,8u@22.0,8d@23.2,8u@23.6"
          sleep 36
          xcrun simctl io booted screenshot war_after.png
          ps aux | grep "J2MEEmu.app" | grep -v grep || { echo "APP DEAD in war"; exit 1; }

      - name: Real game key effect check
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          a = Image.open("war_before.png").convert("RGB")
          b = Image.open("war_after.png").convert("RGB")
          def crop(im):
              w, h = im.size
              return im.crop((0, int(h*0.15), w, int(h*0.70)))   # 游戏画面区
          d = ImageChops.difference(crop(a), crop(b)).convert("L")
          px = list(d.getdata())
          changed = sum(1 for v in px if v > 24)
          ratio = changed / len(px)
          print(f"war frame changed pixels: {changed}/{len(px)} = {ratio:.3%}")
          assert ratio > 0.008, f"keys had no visible effect on real game ({ratio:.3%})"
          print("REAL GAME KEY PASS")
          PY

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            shot_lib.png
            game_0_nokey.png
            game_*.png
            uicheck.png
            war_before.png
            war_after.png
            rms_save.png
            rms_load.png
